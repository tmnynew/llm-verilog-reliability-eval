[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vleval"
version = "0.1.0"
description = "Reliability evaluation platform for LLM-generated Verilog (benchmark, testbenches, mutants, judge, report)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Digital System Design Lab" }]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
stats = ["scipy>=1.10"]
figures = ["matplotlib>=3.7"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
all = ["vleval[stats,figures,web,dev]"]

[project.scripts]
vleval = "vleval.cli:main"

[tool.setuptools.packages.find]
include = ["vleval*"]

[tool.setuptools.package-data]
vleval = ["templates/*.md"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["eda: requires Verilator/Icarus/Yosys on PATH"]
